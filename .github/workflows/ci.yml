name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: orchid
          POSTGRES_PASSWORD: orchid-local
          POSTGRES_DB: wallet_test
        ports:
          - "55433:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U orchid -d wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run --cwd packages/wallet test
      - run: bun run build
